name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      OPENAI_API_KEY: "fake-key-for-testing"
      PINECONE_API_KEY: "fake-key-for-testing"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ensure test dependencies are installed if they are not in requirements.txt
        pip install pytest pytest-mock pytest-cov httpx

    - name: Run tests with pytest
      run: |
        python -m pytest --cov=src tests/ --cov-report=xml